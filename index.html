<style>
/* Layout: phone-first single column. Dark scoreboard banner on top, scannable prop cards below, player detail in a bottom sheet. */
:root{
  --bg:#eef1f7; --surface:#ffffff; --ink:#0a1733; --muted:#566073; --line:#d6dce8; --chip:#e4e9f2;
  --hdr:#0a1733; --hdr2:#16264d; --hdr-ink:#ffffff; --hdr-muted:#8d9ab5;
  --accent:#0f7a5a; --mint:#3ef0a8; --accent-ink:#ffffff; --hit:#0f7a5a; --miss:#d7263d; --warn:#9a6a00; --warn-bg:#fff3d6; --hit-bg:#dcf7ea; --miss-bg:#fde4e8;
  --f-disp:'Big Shoulders Display','Arial Narrow',sans-serif; --f-body:'DM Sans',system-ui,sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#070f24; --surface:#0f1c3a; --ink:#e8edf7; --muted:#93a0ba; --line:#22335a; --chip:#16264d;
  --hdr:#060c1f; --hdr2:#0f1c3a; --hdr-ink:#ffffff; --hdr-muted:#8d9ab5;
  --accent:#3ef0a8; --mint:#3ef0a8; --accent-ink:#0a1733; --hit:#3ef0a8; --miss:#ff5b6b; --warn:#f0b840; --warn-bg:#2b2410; --hit-bg:#0f3328; --miss-bg:#3a1520; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#070f24; --surface:#0f1c3a; --ink:#e8edf7; --muted:#93a0ba; --line:#22335a; --chip:#16264d;
  --hdr:#060c1f; --hdr2:#0f1c3a; --hdr-ink:#ffffff; --hdr-muted:#8d9ab5;
  --accent:#3ef0a8; --mint:#3ef0a8; --accent-ink:#0a1733; --hit:#3ef0a8; --miss:#ff5b6b; --warn:#f0b840; --warn-bg:#2b2410; --hit-bg:#0f3328; --miss-bg:#3a1520; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--hdr)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:520px;margin:0 auto}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hdr);color:var(--hdr-ink)}
.brandrow{display:flex;align-items:center;gap:12px;padding-block:12px 4px}
.brand{font-family:var(--f-disp);font-weight:900;font-size:30px;letter-spacing:.02em;white-space:nowrap;display:flex;align-items:center;gap:8px;line-height:1}
.brand svg{width:30px;height:30px;flex:none}
.search{position:relative;flex:1;min-width:0;margin-left:auto;max-width:240px}
.search input{width:100%;background:var(--hdr2);border:1px solid #2b3b63;color:var(--hdr-ink);border-radius:8px;padding:8px 10px 8px 32px;font:inherit;font-size:14px}
.search input::placeholder{color:var(--hdr-muted)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--hdr-muted)}
.results{position:absolute;right:0;top:calc(100% + 6px);width:min(300px,calc(100vw - 32px));background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.25);overflow:hidden;z-index:40}
.results button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
.results button:hover{background:var(--chip)}
.results small{color:var(--muted);font-size:12px}
.results .none{padding:12px;color:var(--muted);font-size:13px}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{font-family:var(--f-disp);font-weight:800;font-size:19px;letter-spacing:.07em;text-transform:uppercase;color:var(--hdr-muted);padding:10px 11px 9px;border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--hdr-ink);border-bottom-color:var(--mint)}
.divrow{background:var(--hdr2)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-block:9px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{font-size:13px;font-weight:600;color:var(--hdr-muted);border:1px solid #2b3b63;border-radius:999px;padding:4px 11px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--hdr-ink);color:var(--hdr);border-color:var(--hdr-ink)}
.demo{font-size:12px;color:var(--muted);padding-block:8px;border-bottom:1px solid var(--line)}
.demo b{color:var(--warn)}
main{padding-block:14px 40px;display:grid;gap:14px}
.slate{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.slate h1{font-family:var(--f-disp);font-size:26px;font-weight:800;margin:0;letter-spacing:.02em;text-wrap:balance}
.slate p{margin:0;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--chip);border-radius:9px;padding:3px}
.seg button{font-size:13px;font-weight:600;padding:7px 4px;border-radius:7px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.list{display:grid;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 14px;display:grid;gap:7px;text-align:left;width:100%}
.card:hover{border-color:var(--muted)}
.row{display:flex;align-items:center;gap:8px;min-width:0}
.between{justify-content:space-between}
.pname{font-family:var(--f-disp);font-weight:800;font-size:23px;line-height:1.1;letter-spacing:.01em}
.team{color:var(--muted);font-size:13px}
.prop{font-family:var(--f-mono);font-size:14px}
.odds{font-family:var(--f-mono);font-size:13px;background:var(--chip);border-radius:6px;padding:2px 7px}
.why{font-size:14px}
.why strong{font-weight:600}
.mu{font-size:13px;color:var(--muted)}
.meter{display:flex;gap:2px;align-items:center}
.meter i{width:9px;height:9px;border-radius:2px;background:var(--line)}
.meter i.on{background:var(--accent)}
.sv{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.sv b{color:var(--ink);font-family:var(--f-mono);font-size:13px;letter-spacing:0}
.spark{display:flex;gap:3px;align-items:flex-end;height:22px;margin-left:auto}
.spark i{width:7px;border-radius:2px 2px 0 0}
.pill{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:2px 8px;white-space:nowrap}
.p-pick{background:var(--hit-bg);color:var(--hit)}
.p-long{background:var(--warn-bg);color:var(--warn)}
.p-stay,.p-killed,.p-blocked{background:var(--miss-bg);color:var(--miss)}
.flag{font-size:12px;color:var(--warn);background:var(--warn-bg);border-radius:6px;padding:3px 8px;justify-self:start}
.reason{font-size:13px;color:var(--miss)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:18px;color:var(--muted);font-size:14px}
.empty h3{margin:0 0 4px;color:var(--ink);font-family:var(--f-disp);font-weight:800;font-size:20px}
h2.sec{font-family:var(--f-disp);font-weight:800;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:6px 0 0}
.inj{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 14px;display:grid;gap:2px}
.inj .row b{font-weight:600}
.rules{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.rules h3{font-family:var(--f-disp);font-weight:800;font-size:20px;margin:0 0 6px;display:flex;gap:8px;align-items:center}
.rules ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(4,8,16,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:92vh;overflow-y:auto;border-radius:16px 16px 0 0;padding-top:8px;padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto}
.shead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.shead .pname{font-size:32px}
.x{width:34px;height:34px;border-radius:50%;background:var(--chip);font-size:18px;line-height:1;flex:none}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 14px;display:grid;gap:9px;min-width:0}
.panel h4{margin:0;font-family:var(--f-disp);font-weight:800;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.toggle{display:inline-grid;grid-template-columns:1fr 1fr;background:var(--chip);border-radius:8px;padding:2px}
.toggle button{font-size:12px;font-weight:600;padding:5px 12px;border-radius:6px;color:var(--muted)}
.toggle button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.chartbox{overflow-x:auto}
.chartbox svg{width:100%;height:auto;display:block}
.cap{font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--chip);border-radius:8px;padding:8px 10px}
.stat span{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stat b{font-family:var(--f-mono);font-size:16px;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:7px 0;border-bottom:1px solid var(--line);text-align:left}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.num,th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.best{color:var(--hit);font-size:11px;font-weight:600;margin-left:6px}
.split{display:grid;gap:6px}
.bar{height:10px;border-radius:5px;background:var(--chip);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.h i{background:var(--ink)}
.checks{display:grid;gap:5px;font-size:14px;margin:0;padding:0;list-style:none}
.checks li{display:flex;gap:8px}
.ok{color:var(--hit);font-weight:700}
.wn{color:var(--warn);font-weight:700}
.legs{margin:0;padding-left:20px;display:grid;gap:8px;font-size:14px}
.legs li::marker{font-family:var(--f-mono);color:var(--muted);font-size:12px}
.btn{font-weight:600;font-size:14px;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:9px 14px;justify-self:start}
.warnbox{background:var(--warn-bg);border-radius:10px;padding:12px 14px;font-size:14px;display:grid;gap:4px}
.warnbox b{color:var(--warn)}
tr.dim td{color:var(--muted);text-decoration:line-through}
tr.dim td:last-child{text-decoration:none}
.tag{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:middle}
.t-best{background:var(--hit-bg);color:var(--hit)}.t-up{background:var(--warn-bg);color:var(--warn)}.t-main{background:var(--chip);color:var(--muted)}
.mode{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.mode button{font-family:var(--f-disp);font-weight:800;font-size:clamp(12px,3.6vw,14px);letter-spacing:.03em;text-transform:uppercase;padding:9px 4px;flex:1 1 auto;white-space:nowrap;color:var(--muted);min-width:0;overflow:hidden}
.mode button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chartbox{position:relative}
.tip{position:absolute;z-index:5;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:8px;padding:7px 10px;font-size:12px;line-height:1.4;white-space:nowrap;transform:translate(-50%,-100%);box-shadow:0 6px 18px rgba(0,0,0,.25)}
.tip b{font-weight:600}
.hitzone{cursor:pointer}
.prob{display:flex;height:22px;border-radius:6px;overflow:hidden;font-size:11px;font-weight:600;font-family:var(--f-mono)}
.prob span{display:flex;align-items:center;padding:0 7px;white-space:nowrap;overflow:hidden}
.prob .pa{background:var(--chip);color:var(--ink)}
.prob .pd{background:var(--line);color:var(--muted);justify-content:center}
.prob .ph{background:var(--ink);color:var(--bg);justify-content:flex-end;flex:1}
.live{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--miss)}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--miss);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.live::before{animation:none}}
.flash{animation:fl 1.2s ease-out}
@keyframes fl{from{background:var(--warn-bg)}to{background:transparent}}
@media (prefers-reduced-motion:reduce){.flash{animation:none}}
.mv{font-family:var(--f-mono);font-size:12px}
.two{display:flex;height:24px;border-radius:6px;overflow:hidden;font-family:var(--f-mono);font-size:12px;font-weight:500}
.two span{display:flex;align-items:center;padding:0 8px;white-space:nowrap}
.two .s1{background:var(--ink);color:var(--bg)}
.two .s2{background:var(--chip);color:var(--ink);flex:1;justify-content:flex-end}
.up{color:var(--hit)}.dn{color:var(--miss)}
.seal{display:inline-flex;align-items:center;gap:6px;background:var(--hdr);color:var(--mint);border-radius:999px;padding:3px 10px 3px 4px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.seal svg{width:22px;height:22px}
.sealbig{display:flex;align-items:center;gap:10px}
.sealbig svg{width:44px;height:44px}
.lugame{gap:8px}
.lutitle{font-family:var(--f-disp);font-weight:800;font-size:19px}
.lusplit{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.luth{display:flex;align-items:center;justify-content:space-between;gap:6px;min-width:0}
.lugrid{display:grid;grid-template-columns:minmax(0,1fr) 38px minmax(0,1fr);gap:5px 4px;align-items:stretch}
.lucell{display:flex;flex-direction:column;gap:1px;background:var(--chip);border-radius:8px;padding:6px 8px;min-width:0;text-align:left;font:inherit;color:inherit;border:0}
button.lucell{cursor:pointer}button.lucell:hover{outline:1px solid var(--line)}
.lucell.h{text-align:right;align-items:flex-end}
.lucell.empty{color:var(--muted);justify-content:center}
.lunm{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.lusub{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.lust{color:var(--hit)}.luq{color:var(--warn)}
.luslot{display:flex;align-items:center;justify-content:center;font-family:var(--f-disp);font-weight:800;font-size:13px;letter-spacing:.04em;color:var(--muted)}
.luout{display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start}
.luout .pill{font-size:10px}
.lucell .tag{align-self:flex-start;margin:0 0 2px}
.lucell.h .tag{align-self:flex-end}
.mline{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.mline .pill{flex:none}
.chipsrow{display:flex;flex-wrap:wrap;gap:5px}
.pchip{font-size:12px;background:var(--chip);border-radius:6px;padding:3px 8px;font-family:var(--f-mono)}
.pchip.good{background:var(--hit-bg);color:var(--hit)}
.srcs{font-size:12px;color:var(--muted);word-break:break-all;display:grid;gap:3px}
.srcs a{color:var(--muted)}
</style>

      <div class="brand"><svg viewBox="0 0 76 76" aria-hidden="true"><circle cx="38" cy="38" r="36" fill="#16264d"/><circle cx="38" cy="38" r="26" fill="#3ef0a8"/><path d="M24 39 l10 10 l19 -22" fill="none" stroke="#0a1733" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>STAMPED</div>

<script>
fetch('./data.json?v='+Date.now()).then(r=>r.json()).then(DATA=>{

const VETTING=(()=>{try{return location.hash==='#vetting'}catch(e){return false}})();
const POSN={PG:'point guards',SG:'shooting guards',SF:'small forwards',PF:'power forwards',C:'centers',G:'guards',F:'forwards',QB:'quarterbacks',RB:'running backs',WR:'receivers',TE:'tight ends'};
const STATN={points:'points',rebounds:'rebounds',assists:'assists',threes:'threes',steals:'steals',blocks:'blocks',PRA:'points + rebounds + assists','rush yds':'rushing yards','rec yds':'receiving yards','pass yds':'passing yards',receptions:'catches','pass TDs':'passing TDs',fantasy:'fantasy points'};
const GL=g=>g==='favorable'?'Matchup helps':g==='hostile'?'Tough matchup':'Average matchup';
const GC=g=>g==='favorable'?'p-pick':g==='hostile'?'p-stay':'p-long';
const P=DATA.players,GAMES=DATA.games,INJ=DATA.injuries;
const LEAGUES=[
 {id:'nba',name:'NBA',units:'games',u:'g'},
 {id:'nfl',name:'NFL',units:'games',u:'g'},
 {id:'mlb',name:'MLB',units:'games',u:'g',off:true},
 {id:'soccer',name:'Soccer',units:'matches',u:'m'},
 {id:'golf',name:'Golf',units:'events',u:'ev'},
 {id:'tennis',name:'Tennis',units:'matches',u:'m'}
];
const CHECKS={
 nba:['Opponent pace','Defensive rating','Position defense','3PT defense','Current-season head-to-head','Injuries','Minutes restrictions','Back-to-back'],
 nfl:['Matchup','Injuries','Game script','Weather'],
 soccer:['Confirmed starting XI','60+ minutes in each sample match','Opponent shots allowed','Rotation risk (midweek cup / UCL)','Injuries and suspensions'],
 tennis:['Surface this season','Opponent hold / break %','Fatigue from last match','Retirement risk','Indoor vs outdoor'],

  <li>NFL: quarterback absences were tested too; they help but the NFL model still trails the opening line, so NFL team picks stay paused.</li>
  <li>Moneylines at any price (no −160 cap). +300 or longer is still too long a shot.</li></ul></div>`;
 const extra={
  soccer:`<div class="rules"><h3>Soccer <span class="pill p-long">New draft</span></h3><ul><li>Last 5 current-season matches across league and cups. A match under 60 minutes is flagged.</li><li>Props: shots, shots on target, anytime goal/assist, saves, tackles, fouls.</li><li>Starting XI must be confirmed before a pick is final.</li><li>Midweek Champions League or cup games drop the rating by 1 for rotation risk.</li></ul></div>`,
  golf:`<div class="rules"><h3>Golf <span class="pill p-long">New draft</span></h3><ul><li>Last 5 events played this season. A missed cut counts as a miss.</li><li>Props: make cut, top 20, top 10, top 5, round score, head-to-head matchups.</li><li>Top 5 and outright winner bets are always longshots, capped at 5.</li><li>Nothing after the first tee time of round 1.</li></ul></div>`,
  tennis:`<div class="rules"><h3>Tennis <span class="pill p-long">New draft</span></h3><ul><li>Last 5 matches this season, same surface first.</li><li>Props: total games, games won, aces, double faults, set spread.</li><li>Flag a player coming off a long previous match or a recent retirement.</li></ul></div>`,
  nfl:`<div class="rules"><h3>NFL standing rules</h3><ul><li>No Giants RB legs on matchup math alone.</li><li>No Ravens QB legs on Fagnano's sample. No Lamar Jackson legs until he is off IR.</li></ul></div>`};

}

/* ---------- parlays ---------- */
const legP=o=>imp(o)/1.045;
const propPool=()=>P.filter(p=>onSlate(p)&&p.when.slice(0,10)===todayET()&&p.state==='pick'&&p.best.ev.stars>=7&&!p.pending);
const propLeg=p=>({name:`${p.name} (${p.team})`,line:p.best.ev.label,odds:p.best.odds,sub:`Hit in ${p.best.ev.k} of last ${p.best.ev.n} · Secure Value ${p.best.ev.stars} · ${p.best.book} · ${lgOf(p.lg).name}`});
function parlayCard(title,legs,note){
 const d=legs.reduce((a,l)=>a*dec(l.odds),1),pr=legs.reduce((a,l)=>a*legP(l.odds),1);
 return `<div class="panel"><div class="row between"><h4>${title}</h4><span class="odds">${fo(am(d))}</span></div>${note?`<div class="mu">${note}</div>`:''}
  <ol class="legs">${legs.map(l=>`<li><div class="row between" style="align-items:flex-start"><span><b>${l.name}</b> ${l.line}</span><span class="odds">${fo(l.odds)}</span></div><div class="cap">${l.sub}</div></li>`).join('')}</ol>
  <div class="stats"><div class="stat"><span>Legs</span><b>${legs.length}</b></div><div class="stat"><span>All hit</span><b>~${(pr*100).toFixed(pr<.1?1:0)}%</b></div><div class="stat"><span>Combined</span><b>${fo(am(d))}</b></div></div>
  <div class="cap">Hit chance comes from the books' own prices. Legs are at different books, so build the slip in one book and use its payout.</div></div>`}
function parlaysHTML(){
 const pool=propPool().sort((a,b)=>b.best.ev.stars-a.best.ev.stars||b.best.odds-a.best.odds);
 const legs=[];const seen=new Set();for(const p of pool){if(seen.has(p.team))continue;seen.add(p.team);legs.push(p);if(legs.length===6)break}
 const mls=GAMES.filter(g=>gameOnSlate(g)&&g.when.slice(0,10)===todayET()).map(g=>[g,decide(g)]).filter(([,d])=>d.status==='pick'&&!d.long).map(([g,d])=>({name:`${d.team} moneyline`,line:'',odds:g.ml[d.side],sub:`${g.away.n} at ${g.home.n} · ${fmtT(g.when)} ET · Secure Value ${d.sv} · ${g.ml.book}`}));
 let html=`<div class="slate"><h1>Parlay builder · ${fmtDay(todayET())}</h1><p>${pool.length} prop legs qualify today</p></div>
 <div class="warnbox"><b>Read this first</b><span>A parlay only pays if every leg hits. One miss and the whole thing loses. Even legs on a hot streak miss often, so a 6-leg parlay loses most of the time. Bet these small. They are not easy money.</span></div>
 <div class="cap">Built from today's stamped picks, one leg per team.</div>
 <h2 class="sec">6-pick prop parlay</h2>`;
 html+=legs.length>=6?parlayCard('Highest Secure Value',legs.map(propLeg),'The six best-supported legs on the board, one per team.')
  :`<div class="empty"><h3>Not enough legs today</h3>A 6-pick parlay needs 6 stamped legs from games that haven't started. Today there ${legs.length===1?'is':'are'} ${legs.length}.${legs.length?` Here ${legs.length===1?'it is':'they are'} as a smaller parlay, if you want one:`:''}</div>`+(legs.length>=2?parlayCard(`${legs.length}-leg version`,legs.map(propLeg)):'');
 html+=`<h2 class="sec">4-team moneyline parlay</h2>`;
 html+=mls.length>=4?parlayCard('Best model odds',mls.slice(0,4),'Uses the posted prices from the Teams screen.')
  :`<div class="empty"><h3>Not enough moneyline picks</h3>A 4-team parlay needs 4 stamped moneyline picks today. There ${mls.length===1?'is':'are'} ${mls.length}.</div>`;
 return html;
}

const MONO='IBM Plex Mono,monospace';
function chartSVG(p,count,ostat,oline,olabel){
 const b=p.best,stat=ostat||(b?b.stat:Object.keys(p.games[0].s).find(k=>p.games.some(g=>g.s[k]!=null))),line=ostat?oline:(b?b.line:null);
 const rows=p.games.filter(g=>g.s[stat]!=null).slice(0,count),vals=[...rows].reverse(),fin=stat==='finish';
 const W=360,H=190,top=22,bot=30,left=4,right=70,ph=H-top-bot,slots=Math.max(vals.length,5),sw=(W-left-right)/slots,bw=Math.min(30,sw*.62);
 const sc=v=>fin?Math.max(1,60-Math.min(v,60)):v;
 const maxv=Math.max(...vals.map(g=>sc(g.s[stat])),line!=null?sc(line):0,1)*1.18;
 let g=`<line x1="${left}" x2="${W-right}" y1="${top+ph}" y2="${top+ph}" stroke="var(--line)"/>`;
 vals.forEach((row,i)=>{const v=row.s[stat],x=left+i*sw+(sw-bw)/2,bh=Math.max(2,sc(v)/maxv*ph),y=top+ph-bh,hit=line!=null?isHit(stat,v,line):null;
  const tip=`${fmtD(row.d)} · ${row.res}|${row.vs}|${fmtV(stat,v)}${stat==='finish'||stat==='cut'?'':' '+stat}${hit==null?'':hit?' · Hit':' · Miss'}${row.min!=null?` · ${row.min}${p.lg==='nfl'?'% snaps':' min'}`:''}`;
  g+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="3" fill="var(${hit==null?'--muted':hit?'--hit':'--miss'})"/>
  <text x="${(x+bw/2).toFixed(1)}" y="${(y-6).toFixed(1)}" text-anchor="middle" font-family="${MONO}" font-size="11" fill="var(--ink)">${fmtV(stat,v)}</text>
  <text x="${(x+bw/2).toFixed(1)}" y="${H-10}" text-anchor="middle" font-size="10" fill="var(--muted)">${md(row.d)}</text>
  <rect class="hitzone" data-tip="${tip}" x="${(left+i*sw).toFixed(1)}" y="0" width="${sw.toFixed(1)}" height="${H}" fill="transparent"/>`});
 if(line!=null&&stat!=='cut'){const ly=top+ph-sc(line)/maxv*ph;
  g+=`<line x1="${left}" x2="${W-right+4}" y1="${ly.toFixed(1)}" y2="${ly.toFixed(1)}" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${W-right+8}" y="${(ly-4).toFixed(1)}" font-size="10" font-weight="600" fill="var(--accent)">${olabel||'Prediction'}</text><text x="${W-right+8}" y="${(ly+11).toFixed(1)}" font-family="${MONO}" font-size="11" fill="var(--accent)">${fin?'Top '+line:line}</text>`}
 return {svg:`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${stat} game log">${g}</svg>`,stat,n:rows.length};
}
function teamChart(g,side){
 const t=g[side],vals=[...t.l5].reverse();
 const W=360,H=150,top=16,bot=24,left=4,right=8,ph=H-top-bot,mid=top+ph/2,sw=(W-left-right)/5,bw=Math.min(34,sw*.6);
 const mx=Math.max(...t.l5.map(x=>Math.abs(x.m)),1)*1.25;
 let s=`<line x1="${left}" x2="${W-right}" y1="${mid}" y2="${mid}" stroke="var(--line)"/>`;
 vals.forEach((row,i)=>{const v=row.m,x=left+i*sw+(sw-bw)/2,bh=Math.max(2,Math.abs(v)/mx*(ph/2)),y=v>=0?mid-bh:mid;
  s+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="3" fill="var(${v>0?'--hit':v<0?'--miss':'--muted'})"/>
  <text x="${(x+bw/2).toFixed(1)}" y="${(v>=0?y-4:y+bh+12).toFixed(1)}" text-anchor="middle" font-family="${MONO}" font-size="11" fill="var(--ink)">${v>0?'+':''}${v}</text>
  <text x="${(x+bw/2).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="10" fill="var(--muted)">${md(row.d)}</text>
  <rect class="hitzone" data-tip="${fmtD(row.d)}|${row.vs}|${row.res}" x="${(left+i*sw).toFixed(1)}" y="0" width="${sw.toFixed(1)}" height="${H}" fill="transparent"/>`});
 return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t.n} last 5 margins">${s}</svg>`;
}

 x=Math.max(tw/2,Math.min(br.width-tw/2,x));tip.style.left=x+'px';tip.style.top=Math.max(tip.offsetHeight,24)+'px'}
const sheet=$('#sheet');
sheet.addEventListener('pointerover',e=>{const z=e.target.closest('[data-tip]');if(z)showTip(z)});
sheet.addEventListener('pointerout',e=>{const z=e.target.closest('[data-tip]');if(z&&e.pointerType==='mouse'){z.closest('.chartbox').querySelector('.tip').hidden=true}});

function render(){renderTabs();renderMain();save()}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('[data-lg]');if(!b)return;state.lg=b.dataset.lg;render()});
$('#main').addEventListener('click',e=>{const fs=e.target.closest('[data-fsys]');if(fs){FSYSSEL=fs.dataset.fsys;try{localStorage.setItem('stamped-fsys',FSYSSEL)}catch(_){}P.forEach(p=>setFantasy(p,FSYSSEL));renderMain();return}
 const md_=e.target.closest('[data-mode]');if(md_){state.mode=md_.dataset.mode;renderMain();save();return}
 const v=e.target.closest('[data-view]');if(v){state.view=v.dataset.view;renderMain();save();return}
 const c=e.target.closest('[data-id]');if(c){openSheet(c.dataset.id);return}
 const gm=e.target.closest('[data-game]');if(gm)openGame(gm.dataset.game)});
$('#scrim').addEventListener('click',e=>{const z=e.target.closest('[data-tip]');if(z){showTip(z);return}
 if(e.target.id==='scrim'||e.target.id==='close'){closeSheet();return}
 const t=e.target.closest('[data-count]');if(t&&openKind==='player'){state.count=+t.dataset.count;$('#sheet').innerHTML=playerSheet(P.find(x=>x.id===openId))}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#scrim').hidden)closeSheet();$('#results').hidden=true}});
const q=$('#q'),res=$('#results');
q.addEventListener('input',()=>{const t=q.value.trim().toLowerCase();if(!t){res.hidden=true;return}
 const mp=P.filter(p=>onSlate(p)&&(p.name+' '+p.team).toLowerCase().includes(t)).slice(0,6).map(p=>`<button data-pick="${p.id}"><span>${p.name}<br><small>${p.team}</small></span><small>${lgOf(p.lg).name}</small></button>`);
 const mg=GAMES.filter(g=>gameOnSlate(g)&&(g.home.n+' '+g.away.n).toLowerCase().includes(t)).slice(0,4).map(g=>`<button data-g="${g.id}"><span>${g.away.n} at ${g.home.n}<br><small>Team prediction · ${fmtT(g.when)} ET</small></span><small>${lgOf(g.lg).name}</small></button>`);
 const all=[...mg,...mp];res.innerHTML=all.length?all.join(''):'<div class="none">No one by that name plays in the current slate.</div>';res.hidden=false});
res.addEventListener('click',e=>{const b=e.target.closest('[data-pick]');const bg=e.target.closest('[data-g]');
 if(b){const p=P.find(x=>x.id===b.dataset.pick);state.lg=p.lg;state.mode='today';render();openSheet(p.id)}
 else if(bg){const g=GAMES.find(x=>x.id===bg.dataset.g);state.lg=g.lg;state.mode='today';render();openGame(g.id)}
 else return;res.hidden=true;q.value=''});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))res.hidden=true});
$('#checked').textContent=DATA.checked;
render();
setInterval(()=>{if(state.mode!=='live')renderMain()},60000);
if(window.LiveUI)LiveUI.start(DATA,{showSheet});
if(window.DFF){DFF.load().then(()=>{if(state.mode==='fantasy')renderMain()});setInterval(()=>DFF.load().then(()=>{if(state.mode==='fantasy'&&$('#scrim').hidden)renderMain()}),5*60e3)}
if(window.PREV)PREV.start({showSheet,onChange:()=>{if(['nfl','nba','soccer'].includes(state.lg)&&state.mode!=='live'&&$('#scrim').hidden)renderMain()}});
/* New data from the daily pipeline: reload so every rule reruns on it, but never while a sheet is open or someone is typing. */
setInterval(()=>fetch('./data.json?v='+Date.now()).then(r=>r.json()).then(d=>{if(d.checked===DATA.checked&&d.lineups_checked===DATA.lineups_checked&&d.dvp_checked===DATA.dvp_checked)return;
 const go=()=>{if($('#scrim').hidden&&!/INPUT|SELECT|TEXTAREA/.test((document.activeElement||{}).tagName||''))location.reload()};go();setInterval(go,15e3)}).catch(()=>{}),5*60e3);

}).catch(e=>{document.getElementById('main').innerHTML='<div class="empty"><h3>Could not load today\'s data</h3>Check your connection and pull to refresh.</div>'});
</script>
</body>
</html>
